version: '3.8'

services:
  db:
    image: postgres
    container_name: accounting-db
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - accounting-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: accounting-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/accounting_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - accounting-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: accounting-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://backend:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - accounting-network

networks:
  accounting-network:
    driver: bridge

volumes:
  pgdata:
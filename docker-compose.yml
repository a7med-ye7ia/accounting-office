version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: accounting-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # ربط الباك إند بقاعدة بيانات Neon السحابية
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ep-orange-bonus-an80r1b5-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - SPRING_DATASOURCE_USERNAME=neondb_owner
      - SPRING_DATASOURCE_PASSWORD=npg_jB9aKS3XcDYN
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - accounting-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: accounting-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - accounting-network

networks:
  accounting-network:
    driver: bridge
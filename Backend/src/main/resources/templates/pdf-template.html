<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        /* OpenHTMLToPDF requires you to declare the font explicitly */
        @font-face {
            font-family: 'Noto Naskh';
            src: url('classpath:/fonts/NotoNaskhArabic-Regular.ttf');
            -fs-pdf-font-embed: embed;
            -fs-pdf-font-encoding: Identity-H;
        }
        body {
            font-family: 'Noto Naskh', serif;
            color: #111827;
            line-height: 1.9;
            padding: 28px 42px 36px;
            font-size: 16px;
            background: #ffffff;
        }

        .page {
            border-left: 8px solid #000000;
            border-right: 8px solid #000000;
            padding: 0 18px 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
            padding-top: 6px;
        }

        .section {
            margin: 0 0 24px;
            padding: 22px 18px 18px;
            border: 1px solid #d7dee9;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        .section-title {
            margin: 0 0 16px;
            text-align: right;
            font-size: 24px;
            font-weight: 900;
            color: #111827;
        }

        p {
            white-space: pre-wrap;
            font-size: 16px;
            text-align: justify;
            margin: 0;
        }
        /* Add this below your existing CSS */

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
            margin-bottom: 18px;
            font-family: 'Noto Naskh', serif;
            font-size: 15px;
        }

        /* only vertical borders on table cells (remove horizontal lines) */
        th, td {
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
            padding: 12px 14px;
            text-align: right; /* Aligns text properly for RTL */
            font-size: 15px;
        }

        th {
            background-color: #f8fafc;
            color: #0f172a;
            font-weight: 800;
        }

        tr {
            /* This prevents a single row from being cut in half if it hits the bottom of the PDF page */
            page-break-inside: avoid;
        }

        /* Optional: Zebra striping for readability */
        tr:nth-child(even) {
            background-color: #ffffff;
        }
        .heading {
            text-align: center;
            margin-bottom: 10px;
        }

        .doc-title,
        .doc-company,
        .doc-legal {
            display: inline-block;
            margin: 0;
            padding-bottom: 2px;
            border-bottom: 4px solid black;
        }

        .doc-title {
            font-size: 22px;
            font-weight: 900;
        }

        .doc-company {
            font-size: 18px;
            font-weight: 800;
        }

        .doc-legal {
            font-size: 14px;
            font-weight: 700;
        }
        .subtitle {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 900;
            color: #111827;
            letter-spacing: 0;
        }

        .article-labels {
            margin: 6px 0 0;
            font-size: 16px;
            font-weight: 800;
            color: #111827;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="header">

    <div class="heading">
        <h1 class="doc-title" th:text="${contractTitle}">عقد تعديل المادة 5</h1>
    </div>

    <div class="heading">
        <h2 class="doc-company" th:text="${companyName}">شركة الرمال للتنمية والعقارات الحديثة</h2>
    </div>

    <div class="heading">
        <h3 class="doc-legal" th:text="${companyLegalLine}">
            شركة ذات مسئولية محدودة خاضعة لأحكام القانون رقم 159 لسنة 1981
        </h3>
    </div>

    <div class="article-labels" th:if="${articleLabels != null and !articleLabels.isEmpty()}">
        <span th:each="label,iterStat : ${articleLabels}">
            <span th:text="${label}">المادة الخامسة</span><span th:if="${!iterStat.last}">، </span>
        </span>
    </div>

</div>

    <div th:each="sec,iterStat : ${sections}">
        <div class="section">
            <h3 class="section-title" th:text="${sec.sectionTitleBefore}">الماده قبل التعديل</h3>
            <p th:text="${sec.beforeText}">النص قبل</p>
        </div>

        <div class="section">
            <h3 class="section-title" th:text="${sec.sectionTitleAfter}">الماده بعد التعديل</h3>
            <p th:text="${sec.afterText}">النص بعد</p>
        </div>
    </div>
</div>
</body>
</html>

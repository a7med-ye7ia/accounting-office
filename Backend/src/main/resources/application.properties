
server.port=${SERVER_PORT:8080}
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ==========================================
# 3. JPA & Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/migrate-subtasks.sql
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ==========================================
# 4. HikariCP Settings (Optimized for Serverless/Neon)
# ==========================================
# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Disable DevTools restart to avoid classloader issues during local startup
spring.devtools.restart.enabled=false

# ==========================================
# 5. JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# 6. Mail (SMTP) Configuration
# ==========================================
# Fill in your Gmail address and an App Password (not your regular password).
# To create a Gmail App Password: Google Account → Security → 2-Step Verification → App Passwords
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# 7. Cloud Connection Configuration
# ==========================================
# Update this every time you restart Lightning AI and get a new Ngrok URL
ocr.api.url=${OCR_API_URL:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Qwen3-Embedding-0.6B supports a 32K-token context. The application uses a
# conservative character cap and fails visibly rather than silently truncating a legal article.
ai.embedding.max-input-characters=16000

# vLLM / OpenAI-compatible inference settings
ai.base-url=${AI_BASE_URL:http://vllm-generation:8000/v1}
ai.api-key=${AI_API_KEY:}
ai.generation-model=${AI_GENERATION_MODEL:qwen-local}
ai.embedding-base-url=${AI_EMBEDDING_BASE_URL:http://vllm-embeddings:8000/v1}
ai.embedding-model=${AI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:120}
